<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent:  #7c6aff;
      --accent2: #c96bdb;
      --danger:  #ff6b7a;
      --green:   #4ade80;
      --amber:   #fbbf24;
      --blue:    #60a5fa;
      --r:  16px;
      --rs: 10px;
      --rx: 7px;
      --tr: 0.18s ease;
    }
    [data-theme="dark"] {
      --bg:      #0f0e17;
      --surface: #1a1828;
      --card:    #22203a;
      --border:  #2e2b4a;
      --text:    #e8e6f4;
      --text2:   #b0aec8;
      --muted:   #6a6890;
      --shadow:  rgba(0,0,0,0.45);
      color-scheme: dark;
    }
    [data-theme="light"] {
      --bg:      #f0effa;
      --surface: #ffffff;
      --card:    #f5f4fd;
      --border:  #dddaf0;
      --text:    #1a1830;
      --text2:   #4a4868;
      --muted:   #9896b8;
      --shadow:  rgba(0,0,0,0.08);
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--tr), color var(--tr);
    }
    [data-theme="dark"] body {
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -5%,  rgba(124,106,255,.15) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 105%, rgba(201,107,219,.10) 0%, transparent 50%);
    }

    .app { max-width: 680px; margin: 0 auto; padding: 0 16px 100px; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; color: #fff;
      box-shadow: 0 4px 12px rgba(124,106,255,.35);
    }
    .logo-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.3rem; font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #e879f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .icon-btn {
      width: 38px; height: 38px;
      border: 1px solid var(--border); background: var(--surface);
      border-radius: var(--rx); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2); transition: all var(--tr);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,106,255,.08); }

    /* ── Stats ── */
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--rs); padding: 14px 16px; text-align: center;
      transition: border-color var(--tr), transform var(--tr);
    }
    .stat-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .stat-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.7rem; font-weight: 800; line-height: 1; margin-bottom: 4px;
    }
    .stat-label { font-size: .71rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat-card.s-total   .stat-num { color: var(--accent); }
    .stat-card.s-active  .stat-num { color: var(--blue); }
    .stat-card.s-done    .stat-num { color: var(--green); }
    .stat-card.s-overdue .stat-num { color: var(--danger); }

    /* ── Search + Sort ── */
    .search-sort { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-input {
      width: 100%; padding: 11px 16px 11px 40px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--rs); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: .9rem; outline: none;
      transition: border-color var(--tr), box-shadow var(--tr);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,255,.14); }
    .sort-select {
      padding: 11px 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--rs); color: var(--text2);
      font-family: 'Inter', sans-serif; font-size: .85rem; font-weight: 500;
      outline: none; cursor: pointer; transition: border-color var(--tr);
      min-width: 148px;
    }
    .sort-select:focus { border-color: var(--accent); }

    /* ── Add Card ── */
    .add-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--r); padding: 18px 20px; margin-bottom: 20px;
      transition: border-color var(--tr), box-shadow var(--tr);
    }
    .add-card:focus-within { border-color: rgba(124,106,255,.5); box-shadow: 0 0 0 3px rgba(124,106,255,.07); }
    .add-main { display: flex; gap: 10px; }
    input[type="text"], input[type="date"], select, textarea {
      font-family: 'Inter', sans-serif;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--rx); color: var(--text); outline: none;
      transition: border-color var(--tr), box-shadow var(--tr);
      font-size: .9rem;
    }
    input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,255,.12); }
    .add-main input[type="text"] { flex: 1; padding: 12px 16px; font-size: .95rem; }
    .btn-add {
      padding: 12px 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; border-radius: var(--rs);
      font-family: 'Inter', sans-serif; font-size: .93rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(124,106,255,.3);
      transition: opacity var(--tr), transform .12s, box-shadow var(--tr);
    }
    .btn-add:hover  { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 22px rgba(124,106,255,.4); }
    .btn-add:active { transform: translateY(0); }
    .expand-btn {
      background: none; border: none; color: var(--muted);
      font-family: 'Inter', sans-serif; font-size: .8rem; font-weight: 500;
      cursor: pointer; padding: 8px 0 0;
      display: flex; align-items: center; gap: 5px;
      transition: color var(--tr);
    }
    .expand-btn:hover { color: var(--accent); }
    .extra-fields { display: none; flex-direction: column; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .extra-fields.open { display: flex; }
    .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-group { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: .73rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .field-input { padding: 9px 12px; }
    select.field-input, input[type="date"].field-input { cursor: pointer; }
    textarea.field-input { resize: vertical; min-height: 64px; line-height: 1.5; }

    /* ── Filter Tabs ── */
    .filters {
      display: flex; gap: 6px; margin-bottom: 18px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px;
    }
    .filters button {
      flex: 1; padding: 8px 12px; border: none; border-radius: 999px;
      background: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: .82rem; font-weight: 600;
      color: var(--muted); transition: all var(--tr);
    }
    .filters button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; box-shadow: 0 2px 10px rgba(124,106,255,.35);
    }

    /* ── Task List ── */
    #todo-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .todo-item {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px 18px;
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: var(--r);
      transition: border-color var(--tr), transform var(--tr), box-shadow var(--tr);
    }
    .todo-item:hover { border-color: rgba(124,106,255,.35); transform: translateY(-1px); box-shadow: 0 4px 20px var(--shadow); }
    .todo-item.priority-high   { border-left-color: rgba(255,107,122,.6); }
    .todo-item.priority-medium { border-left-color: rgba(251,191,36,.6); }
    .todo-item.priority-low    { border-left-color: rgba(74,222,128,.6); }
    .todo-item.completed       { opacity: .5; }

    /* Custom checkbox */
    .cb-wrap { flex-shrink: 0; position: relative; width: 22px; height: 22px; margin-top: 1px; }
    .cb-wrap input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .cb-box {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 7px;
      border: 2px solid var(--border); background: var(--card);
      cursor: pointer; transition: all .18s;
    }
    .cb-wrap input:checked + .cb-box {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent; box-shadow: 0 2px 8px rgba(124,106,255,.4);
    }
    .cb-box svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
    .cb-wrap input:checked + .cb-box svg { opacity: 1; transform: scale(1); }

    /* Task body */
    .task-body { flex: 1; min-width: 0; }
    .task-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .priority-high   .priority-dot { background: var(--danger); box-shadow: 0 0 6px rgba(255,107,122,.5); }
    .priority-medium .priority-dot { background: var(--amber);  box-shadow: 0 0 6px rgba(251,191,36,.4); }
    .priority-low    .priority-dot { background: var(--green);  box-shadow: 0 0 6px rgba(74,222,128,.4); }
    .task-title { font-size: .95rem; font-weight: 500; color: var(--text); cursor: pointer; word-break: break-word; line-height: 1.4; }
    .todo-item.completed .task-title { text-decoration: line-through; color: var(--muted); font-weight: 400; }
    .task-desc { font-size: .81rem; color: var(--muted); margin-bottom: 8px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; border: 1px solid transparent; }
    .due-overdue { background: rgba(255,107,122,.13); color: #ff6b7a; border-color: rgba(255,107,122,.25); }
    .due-today   { background: rgba(251,191,36,.12);  color: #fbbf24; border-color: rgba(251,191,36,.25); }
    .due-soon    { background: rgba(74,222,128,.11);  color: #4ade80; border-color: rgba(74,222,128,.22); }
    .due-future  { background: rgba(124,106,255,.12); color: #a78bfa; border-color: rgba(124,106,255,.25); }
    .tag-badge   { background: rgba(255,255,255,.05); color: var(--text2); border-color: var(--border); }
    .todo-item.completed .badge { background: rgba(255,255,255,.03) !important; color: var(--muted) !important; border-color: var(--border) !important; }

    /* Task actions */
    .task-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .task-btn { width: 30px; height: 30px; border: none; border-radius: var(--rx); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: all var(--tr); }
    .task-btn.edit:hover { color: var(--accent); background: rgba(124,106,255,.12); }
    .task-btn.del:hover  { color: var(--danger);  background: rgba(255,107,122,.12); }

    /* ── Empty ── */
    .empty { text-align: center; padding: 52px 0; }
    .empty-icon  { font-size: 3rem; display: block; margin-bottom: 12px; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    .empty-sub   { font-size: .85rem; color: var(--muted); }

    /* ── Footer ── */
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0 0; margin-top: 16px; border-top: 1px solid var(--border);
      font-size: .8rem; color: var(--muted); font-weight: 500;
      gap: 10px; flex-wrap: wrap;
    }
    .footer-actions { display: flex; gap: 8px; }
    .btn-ghost {
      background: none; border: 1px solid var(--border); color: var(--text2);
      cursor: pointer; font-family: 'Inter', sans-serif; font-size: .8rem; font-weight: 600;
      padding: 6px 14px; border-radius: 999px;
      display: flex; align-items: center; gap: 5px;
      transition: all var(--tr);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,106,255,.08); }
    .btn-clear:hover { border-color: var(--danger) !important; color: var(--danger) !important; background: rgba(255,107,122,.09) !important; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6); backdrop-filter: blur(5px);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); width: 100%; max-width: 480px;
      padding: 28px; box-shadow: 0 24px 64px rgba(0,0,0,.45);
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .modal-title  { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; font-weight: 700; }
    .modal-body   { display: flex; flex-direction: column; gap: 14px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .modal .field-input { width: 100%; }
    .btn-primary {
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; border-radius: var(--rs);
      font-family: 'Inter', sans-serif; font-size: .9rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 14px rgba(124,106,255,.3);
      transition: opacity var(--tr), transform .12s;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-secondary {
      padding: 10px 18px; background: none; border: 1.5px solid var(--border);
      color: var(--text2); border-radius: var(--rs);
      font-family: 'Inter', sans-serif; font-size: .9rem; font-weight: 500; cursor: pointer;
      transition: all var(--tr);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toast ── */
    .toast-wrap { position: fixed; bottom: 28px; right: 28px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--rs); padding: 12px 18px;
      font-size: .875rem; font-weight: 500; color: var(--text);
      box-shadow: 0 8px 28px var(--shadow);
      display: flex; align-items: center; gap: 10px; max-width: 300px;
      animation: tIn .22s ease forwards;
    }
    .toast.out { animation: tOut .18s ease forwards; }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error   { border-left: 3px solid var(--danger); }
    .toast.info    { border-left: 3px solid var(--accent); }
    @keyframes tIn  { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes tOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(16px); } }

    /* ── Keyboard hint ── */
    kbd { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: .7rem; color: var(--muted); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    @media (max-width: 520px) {
      .stats-row    { grid-template-columns: repeat(2,1fr); }
      .search-sort  { flex-direction: column; }
      .fields-row   { grid-template-columns: 1fr; }
      .footer       { flex-direction: column; align-items: flex-start; }
      .footer-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="logo">
      <div class="logo-icon">✓</div>
      <span class="logo-text">TaskFlow</span>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">
      <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>

  <div class="stats-row">
    <div class="stat-card s-total">  <div class="stat-num" id="s-total">0</div>  <div class="stat-label">Total</div>   </div>
    <div class="stat-card s-active"> <div class="stat-num" id="s-active">0</div> <div class="stat-label">Active</div>  </div>
    <div class="stat-card s-done">   <div class="stat-num" id="s-done">0</div>   <div class="stat-label">Done</div>    </div>
    <div class="stat-card s-overdue"><div class="stat-num" id="s-overdue">0</div><div class="stat-label">Overdue</div></div>
  </div>

  <div class="search-sort">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search tasks…  (/)" autocomplete="off" />
    </div>
    <select class="sort-select" id="sort-select" onchange="render()">
      <option value="due">Sort: Due Date</option>
      <option value="priority">Sort: Priority</option>
      <option value="name">Sort: Name A–Z</option>
      <option value="created">Sort: Newest</option>
    </select>
  </div>

  <div class="add-card">
    <div class="add-main">
      <input type="text" id="todo-input" placeholder="What needs to be done?  (N)" autocomplete="off" />
      <button class="btn-add" onclick="addTodo()">+ Add</button>
    </div>
    <button class="expand-btn" id="expand-btn" onclick="toggleExpand()">
      <svg id="expand-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>
      More options
    </button>
    <div class="extra-fields" id="extra-fields">
      <div class="fields-row">
        <div class="field-group">
          <label class="field-label">Priority</label>
          <select id="add-priority" class="field-input">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Due Date</label>
          <input type="date" id="add-due" class="field-input" />
        </div>
      </div>
      <div class="fields-row">
        <div class="field-group">
          <label class="field-label">Category</label>
          <select id="add-cat" class="field-input">
            <option value="">None</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="shopping">Shopping</option>
            <option value="health">Health</option>
            <option value="finance">Finance</option>
            <option value="education">Education</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Tags (comma-separated)</label>
          <input type="text" id="add-tags" class="field-input" placeholder="urgent, home…" />
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Description</label>
        <textarea id="add-desc" class="field-input" placeholder="Optional notes…"></textarea>
      </div>
    </div>
  </div>

  <div class="filters">
    <button class="active" onclick="setFilter('all',this)">All</button>
    <button onclick="setFilter('active',this)">Active</button>
    <button onclick="setFilter('completed',this)">Completed</button>
  </div>

  <ul id="todo-list"></ul>

  <div class="footer">
    <span id="count-label">0 tasks remaining</span>
    <div class="footer-actions">
      <button class="btn-ghost" onclick="importTasks()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import
      </button>
      <button class="btn-ghost" onclick="exportTasks()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button class="btn-ghost btn-clear" onclick="clearCompleted()">Clear done</button>
    </div>
  </div>

</div>

<!-- Edit Modal -->
<div class="modal-backdrop" id="modal" onclick="onBackdropClick(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Task</span>
      <button class="icon-btn" onclick="closeModal()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="12" y2="12"/><line x1="12" y1="1" x2="1" y2="12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">Task</label>
        <input type="text" id="edit-text" class="field-input" />
      </div>
      <div class="fields-row">
        <div class="field-group">
          <label class="field-label">Priority</label>
          <select id="edit-priority" class="field-input">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Due Date</label>
          <input type="date" id="edit-due" class="field-input" />
        </div>
      </div>
      <div class="fields-row">
        <div class="field-group">
          <label class="field-label">Category</label>
          <select id="edit-cat" class="field-input">
            <option value="">None</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="shopping">Shopping</option>
            <option value="health">Health</option>
            <option value="finance">Finance</option>
            <option value="education">Education</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Tags</label>
          <input type="text" id="edit-tags" class="field-input" placeholder="urgent, home…" />
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Description</label>
        <textarea id="edit-desc" class="field-input"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>
<input type="file" id="file-input" accept=".json" style="display:none" onchange="handleImport(event)" />

<script>
  /* ── State ── */
  let todos    = JSON.parse(localStorage.getItem('tf-todos') || '[]');
  let filter   = 'all';
  let nextId   = todos.length ? Math.max(...todos.map(t => t.id)) + 1 : 1;
  let editingId = null;
  let extraOpen = false;

  const CATS = {
    work:      { label: 'Work',      color: '#60a5fa', bg: 'rgba(96,165,250,.14)'  },
    personal:  { label: 'Personal',  color: '#a78bfa', bg: 'rgba(167,139,250,.14)' },
    shopping:  { label: 'Shopping',  color: '#fb923c', bg: 'rgba(251,146,60,.14)'  },
    health:    { label: 'Health',    color: '#f472b6', bg: 'rgba(244,114,182,.14)' },
    finance:   { label: 'Finance',   color: '#fbbf24', bg: 'rgba(251,191,36,.14)'  },
    education: { label: 'Education', color: '#34d399', bg: 'rgba(52,211,153,.14)'  },
  };
  const PRIO_ORDER = { high: 0, medium: 1, low: 2, none: 3 };

  /* ── Persist ── */
  function save() { localStorage.setItem('tf-todos', JSON.stringify(todos)); }

  /* ── Theme ── */
  const html = document.documentElement;
  (function initTheme() {
    const t = localStorage.getItem('tf-theme') || 'dark';
    html.setAttribute('data-theme', t);
    setThemeIcon(t);
  })();

  function toggleTheme() {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tf-theme', next);
    setThemeIcon(next);
  }

  function setThemeIcon(t) {
    document.getElementById('theme-icon').innerHTML = t === 'dark'
      ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`
      : `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
  }

  /* ── Expand toggle ── */
  function toggleExpand() {
    extraOpen = !extraOpen;
    document.getElementById('extra-fields').classList.toggle('open', extraOpen);
    document.getElementById('expand-icon').innerHTML = extraOpen
      ? `<line x1="1" y1="6" x2="11" y2="6"/>`
      : `<line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/>`;
    document.getElementById('expand-btn').childNodes[2].textContent = extraOpen ? ' Fewer options' : ' More options';
  }

  /* ── CRUD ── */
  function addTodo() {
    const text = document.getElementById('todo-input').value.trim();
    if (!text) { toast('Please enter a task name.', 'error'); return; }
    const tags = document.getElementById('add-tags').value.split(',').map(s => s.trim()).filter(Boolean);
    todos.push({
      id: nextId++, text, completed: false,
      description: document.getElementById('add-desc').value.trim(),
      due:      document.getElementById('add-due').value || null,
      priority: document.getElementById('add-priority').value,
      category: document.getElementById('add-cat').value,
      tags,
      createdAt: Date.now(),
    });
    ['todo-input','add-desc','add-tags'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('add-due').value = '';
    document.getElementById('add-priority').value = 'none';
    document.getElementById('add-cat').value = '';
    save(); render();
    toast('Task added!', 'success');
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (!t) return;
    t.completed = !t.completed;
    save(); render();
    toast(t.completed ? 'Task completed! 🎉' : 'Task reopened.', 'info');
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save(); render();
    toast('Task deleted.', 'info');
  }

  function clearCompleted() {
    const n = todos.filter(t => t.completed).length;
    if (!n) { toast('No completed tasks to clear.', 'info'); return; }
    todos = todos.filter(t => !t.completed);
    save(); render();
    toast(`Cleared ${n} task${n !== 1 ? 's' : ''}.`, 'success');
  }

  /* ── Edit ── */
  function openEdit(id) {
    const t = todos.find(t => t.id === id);
    if (!t) return;
    editingId = id;
    document.getElementById('edit-text').value     = t.text;
    document.getElementById('edit-priority').value = t.priority || 'none';
    document.getElementById('edit-due').value      = t.due || '';
    document.getElementById('edit-cat').value      = t.category || '';
    document.getElementById('edit-tags').value     = (t.tags || []).join(', ');
    document.getElementById('edit-desc').value     = t.description || '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('edit-text').focus(), 50);
  }

  function saveEdit() {
    const t = todos.find(t => t.id === editingId);
    if (!t) return;
    const text = document.getElementById('edit-text').value.trim();
    if (!text) { toast('Task name cannot be empty.', 'error'); return; }
    t.text        = text;
    t.priority    = document.getElementById('edit-priority').value;
    t.due         = document.getElementById('edit-due').value || null;
    t.category    = document.getElementById('edit-cat').value;
    t.tags        = document.getElementById('edit-tags').value.split(',').map(s => s.trim()).filter(Boolean);
    t.description = document.getElementById('edit-desc').value.trim();
    save(); render(); closeModal();
    toast('Task updated.', 'success');
  }

  function closeModal()             { document.getElementById('modal').classList.remove('open'); editingId = null; }
  function onBackdropClick(e)       { if (e.target === document.getElementById('modal')) closeModal(); }

  /* ── Filter / Sort ── */
  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function applySort(arr) {
    const mode = document.getElementById('sort-select').value;
    return [...arr].sort((a, b) => {
      if (mode === 'priority') return (PRIO_ORDER[a.priority] ?? 3) - (PRIO_ORDER[b.priority] ?? 3);
      if (mode === 'name')     return a.text.localeCompare(b.text);
      if (mode === 'created')  return (b.createdAt || 0) - (a.createdAt || 0);
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1; if (!b.due) return -1;
      return a.due.localeCompare(b.due);
    });
  }

  /* ── Badge helpers ── */
  function dueBadge(due) {
    if (!due) return '';
    const today    = new Date().toISOString().slice(0,10);
    const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0,10);
    const [y,m,d]  = due.split('-');
    const label = `${d}/${m}/${y}`;
    const [cls, icon] =
      due < today           ? ['due-overdue','⚠']  :
      due === today         ? ['due-today',  '⏰'] :
      due === tomorrow      ? ['due-soon',   '🔔'] : ['due-future','📅'];
    return `<span class="badge ${cls}">${icon} ${label}</span>`;
  }

  function catBadge(cat) {
    if (!cat || !CATS[cat]) return '';
    const { label, color, bg } = CATS[cat];
    return `<span class="badge" style="color:${color};background:${bg};border-color:${color}44">${label}</span>`;
  }

  function tagBadges(tags) {
    return (tags || []).map(t => `<span class="badge tag-badge">#${esc(t)}</span>`).join('');
  }

  /* ── Render ── */
  function render() {
    const q     = document.getElementById('search-input').value.toLowerCase();
    const today = new Date().toISOString().slice(0,10);

    const filtered = todos.filter(t => {
      const mf = filter === 'all' ? true : filter === 'active' ? !t.completed : t.completed;
      const ms = !q || t.text.toLowerCase().includes(q)
              || (t.description||'').toLowerCase().includes(q)
              || (t.tags||[]).some(tg => tg.toLowerCase().includes(q));
      return mf && ms;
    });

    const visible = applySort(filtered);
    const list = document.getElementById('todo-list');

    if (visible.length === 0) {
      list.innerHTML = `<li class="empty">
        <span class="empty-icon">${todos.length === 0 ? '✨' : '🔍'}</span>
        <div class="empty-title">${todos.length === 0 ? 'No tasks yet' : 'No results'}</div>
        <div class="empty-sub">${todos.length === 0 ? 'Add your first task above.' : 'Try a different search or filter.'}</div>
      </li>`;
    } else {
      list.innerHTML = visible.map(t => {
        const pc   = t.priority && t.priority !== 'none' ? `priority-${t.priority}` : '';
        const dot  = pc ? `<span class="priority-dot"></span>` : '';
        return `<li class="todo-item ${pc}${t.completed ? ' completed' : ''}">
          <label class="cb-wrap">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo(${t.id})" />
            <span class="cb-box"><svg viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9 10.5,3"/></svg></span>
          </label>
          <div class="task-body">
            <div class="task-title-row">${dot}<span class="task-title" onclick="toggleTodo(${t.id})">${esc(t.text)}</span></div>
            ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
            <div class="task-meta">${dueBadge(t.due)}${catBadge(t.category)}${tagBadges(t.tags)}</div>
          </div>
          <div class="task-actions">
            <button class="task-btn edit" onclick="openEdit(${t.id})" title="Edit (E)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
            </button>
            <button class="task-btn del" onclick="deleteTodo(${t.id})" title="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </li>`;
      }).join('');
    }

    const overdue = todos.filter(t => !t.completed && t.due && t.due < today).length;
    document.getElementById('s-total').textContent   = todos.length;
    document.getElementById('s-active').textContent  = todos.filter(t => !t.completed).length;
    document.getElementById('s-done').textContent    = todos.filter(t =>  t.completed).length;
    document.getElementById('s-overdue').textContent = overdue;
    const rem = todos.filter(t => !t.completed).length;
    document.getElementById('count-label').textContent = `${rem} task${rem !== 1 ? 's' : ''} remaining`;
  }

  /* ── Export / Import ── */
  function exportTasks() {
    if (!todos.length) { toast('No tasks to export.', 'info'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(todos, null, 2)], { type: 'application/json' }));
    a.download = `taskflow-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    toast('Exported!', 'success');
  }

  function importTasks() { document.getElementById('file-input').click(); }

  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw 0;
        todos = data;
        nextId = data.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1;
        save(); render();
        toast(`Imported ${data.length} task${data.length !== 1 ? 's' : ''}!`, 'success');
      } catch { toast('Invalid file.', 'error'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  /* ── Toast ── */
  function toast(msg, type = 'info') {
    const icons = { success: '✓', error: '✕', info: 'i' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span>${icons[type]}</span>${msg}`;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, 2600);
  }

  /* ── Keyboard shortcuts ── */
  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    const typing = ['INPUT','TEXTAREA','SELECT'].includes(tag);
    if (e.key === 'Escape') { closeModal(); document.getElementById('search-input').blur(); }
    if (!typing) {
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); document.getElementById('todo-input').focus(); }
      if (e.key === '/')                  { e.preventDefault(); document.getElementById('search-input').focus(); }
    }
    if (e.key === 'Enter' && document.activeElement.id === 'todo-input') addTodo();
    if (e.key === 'Enter' && document.activeElement.id === 'edit-text') saveEdit();
  });

  document.getElementById('search-input').addEventListener('input', render);

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
